# Runs on every PR that touches infrastructure, including PRs opened by agents.
# Demo mode: plans offline with no AWS credentials, the same steps as gate.sh.
# For real accounts, add aws-actions/configure-aws-credentials with a read-only
# plan role, and remove -var offline_demo=true from the plan.
name: intent-gate

on:
  pull_request:
    paths: ["infra/**", "intent/**", "policy/**"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      TF: tofu
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: |
          pip install checkov
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin conftest

      # shell: bash turns on pipefail, so a BLOCK fails the job through tee
      - name: Intent gate
        shell: bash
        run: ./gate.sh | tee -a "$GITHUB_STEP_SUMMARY"
