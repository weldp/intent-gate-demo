# Runs on every PR that touches infrastructure, including PRs opened by agents.
# The job can plan but never apply: its role is read-only in both accounts.
name: intent-gate

on:
  pull_request:
    paths: ["infra/**", "intent/**", "policy/**"]

permissions:
  contents: read
  id-token: write   # OIDC into a read-only plan role

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Read-only credentials for planning
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}   # plan-only; apply lives elsewhere
          aws-region: us-east-1

      - name: Plan
        working-directory: infra
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > ../plan.json

      - name: Existing scanners first
        run: |
          pip install checkov
          checkov -f plan.json --framework terraform_plan --skip-check CKV_AWS_144

      - name: Intent gate
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar -xz conftest
          ./conftest test plan.json --policy policy --data intent
