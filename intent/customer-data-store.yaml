contract:
  service: customer-data-store
  owner: data-platform
  classification: customer-pii
  retention: 400d
  root: aws_s3_bucket.customer_data
  placement: {account: prod}
  accounts: {aws.prod: prod, aws.test: test}
  ingress: [orders-api]
  egress:
    logs_to: [aws_s3_bucket.prod_access_log]
    notify: [ops-mail@acme.example]
  identities:
    customer-data-writer: [s3:PutObject]
  controls: [sse-kms, access-logging, public-access-block]
  needs_named_approval:
    - new egress route
    - new egress destination
    - data reaching another account
